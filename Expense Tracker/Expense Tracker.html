<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="Expense Tracker.css">
</head>
<body>

<div class="card">

    <h2 class="title">Expense Tracker</h2>

    <div class="balance-box">
        <p>Current Balance</p>
        <div class="balance">0</div>
    </div>

    <div class="inputs">
        <input type="text" id="inpbox" placeholder="Enter amount">
        <input type="text" id="purpose" placeholder="Enter purpose">
    </div>

    <div class="buttons">
        <button id="income">Income</button>
        <button id="expense">Expense</button>
    </div>

    <div class="transactions">
        <h3>Transactions</h3>
        <ul class="transaction-list"></ul>
    </div>

</div>

<script src="Expense Tracker.js"></script>
</body>
</html>
