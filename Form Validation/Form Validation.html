<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Morphism Sign Up Form</title>
  <link rel="stylesheet" href="Form Validation.css">
</head>
<body>

  <div class="container">
    <form id="signupForm">
      <h2>Sign Up</h2>

      <div class="input-group">
        <label>Full Name <span style="color:red">*</span></label>
        <input type="text" id="name" placeholder="Enter your name" required>
        <p class="error" id="nameError"></p>
      </div>

      <div class="input-group">
        <label>Email <span style="color:red">*</span></label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <p class="error" id="emailError"></p>
      </div>

      <!-- Password Input with Eye -->
      <div class="input-group password-group">
        <label>Password <span style="color:red">*</span></label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter password" required>
          <span class="toggle-eye" id="togglePassword"></span>
        </div>
        <p class="error" id="passwordError"></p>
      </div>

      <!-- Confirm Password Input with Eye -->
      <div class="input-group password-group">
        <label>Confirm Password <span style="color:red">*</span></label>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" placeholder="Confirm password" required>
          <span class="toggle-eye" id="toggleConfirm"></span>
        </div>
        <p class="error" id="confirmError"></p>
      </div>

      <button type="submit">Sign Up</button>
      <p class="success" id="successMsg"></p>
    </form>
  </div>
<script src="Form Validation.js"></script>
</body>
</html>
