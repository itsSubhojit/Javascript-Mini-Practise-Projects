<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <!-- Link the CSS file -->
    <link rel="stylesheet" href="Password Generator.css">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>

        <div class="result-container">
            <input type="text" id="result" readonly>
            <button id="copy">Copy</button>
        </div>

         <div class="options">
             <div class="length-container">
               <label for="length">Password Length:</label>
               <input type="number" id="length" min="6" max="20">
             </div><br>

          <label><input type="checkbox" id="lowercase"> Include Lowercase</label>
          <label><input type="checkbox" id="numbers"> Include Numbers</label>
          <label><input type="checkbox" id="symbols"> Include Symbols</label>
        </div>

        <button id="generate">Generate Password</button>
    </div>

    <!-- Link the JavaScript file -->
    <script src="Password Generator.js"></script>
</body>
</html>
