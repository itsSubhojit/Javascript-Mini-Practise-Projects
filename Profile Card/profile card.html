<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
</head>
<style>
    body{
        background-color: black;
    }

   #main{
        padding: 40px;
        /*display:flex;*/
        align-items: center;
        /*justify-content: center;*/
        width:100%;
        height:100%;
   }
    
    input{
        display: block;
        border-radius: 5px;
        padding:10px;
        margin-top: 5px;       
    }
    
    .card{
        color: white;
        width: 300px;
        margin-top: 40px;
        padding:20px;
        border-radius: 10px;
        display: inline-block;
        border: 1px solid #555;
    }

    .profile{
        width: 50px;
        height: 50px;
        background-color: red;
        border-radius: 50%;
        overflow: hidden;
    }
    .profile img{
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    

</style>
<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="Profile-pic">
            <input type="text" placeholder="Full Name">
            <input type="text" placeholder="Age">
            <input type="text" placeholder="E-mail">
            <input type="submit">
        </form>
    </div>
    
    <script src="profile card.js"></script>
</body>
</html>
