<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Glass Calculator</title>
  <link rel="stylesheet" href="Simple Calculator.css">
</head>
<body>

  <div class="calculator">
    <div class="display-container">
      <div class="display">0</div>
      <div class="indicator-bar"></div>
    </div>

    <div class="buttons">
      <button class="btn clear">C</button>
      <button id="backspace" class="btn backspace">⌫</button>
      <button class="btn operator">%</button>
      <button class="btn operator">/</button> <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn operator">*</button>

      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn operator">-</button>

      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn operator">+</button>

      <button class="btn zero">0</button>
      <button class="btn">.</button>
      <button class="btn equal">=</button>
    </div>
  </div>


  <script src="Simple Calculator.js"></script>
</body>
</html>
